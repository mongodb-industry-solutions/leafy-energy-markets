env:
  NODE_ENV: production
  APP_ENV: staging
  AWS_REGION: us-east-1

# Disable Istio sidecar — Envoy buffers SSE/streaming responses over HTTP/2,
# breaking Change Stream event delivery and advisor streaming.
podAnnotations:
  sidecar.istio.io/inject: "false"

envSecrets:
  MONGO_URI: leafy-energy-markets-secrets
  AZURE_FOUNDRY_API_KEY: leafy-energy-markets-secrets
  AZURE_FOUNDRY_ENDPOINT: leafy-energy-markets-secrets
  AZURE_FOUNDRY_MODEL: leafy-energy-markets-secrets
  VOYAGE_API_KEY: leafy-energy-markets-secrets

serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-staging-cicd-irsa"
