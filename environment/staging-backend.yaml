env:
  NODE_ENV: production
  APP_ENV: staging
  AWS_REGION: us-east-1

# Tell Istio to use HTTP/1.1 for the backend service — required for SSE streaming.
# Envoy's default HTTP/2 auto-detection buffers SSE responses, breaking Change Stream
# event delivery and advisor token streaming.
service:
  appProtocol: http

envSecrets:
  MONGO_URI: leafy-energy-markets-secrets
  AZURE_FOUNDRY_API_KEY: leafy-energy-markets-secrets
  AZURE_FOUNDRY_ENDPOINT: leafy-energy-markets-secrets
  AZURE_FOUNDRY_MODEL: leafy-energy-markets-secrets
  VOYAGE_API_KEY: leafy-energy-markets-secrets

serviceAccount:
  enabled: true
  irsa:
    accountId: "275662791714"
    roleName: "kanopy-staging-cicd-irsa"
